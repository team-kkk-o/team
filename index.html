<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>기술팀 스페어파트 스캐너</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#EFF4FA;
    --surface:#FFFFFF;
    --surface2:#E7F1FA;
    --ink:#0B2C4D;
    --muted:#5B7286;
    --line:#D3E3F0;
    --accent:#0EA5E0;
    --accent-ink:#04263F;
    --secondary:#0064AA;
    --ok:#1F8B4C;
    --ok-bg:#E5F4EB;
    --warn:#C0392B;
    --warn-bg:#FBEAE8;
    --shadow: 0 1px 2px rgba(11,44,77,0.08), 0 6px 20px rgba(11,44,77,0.10);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#071B30;
      --surface:#0E2A47;
      --surface2:#123353;
      --ink:#EAF3FB;
      --muted:#8FB0CC;
      --line:#1D4468;
      --accent:#22B2EA;
      --accent-ink:#04263F;
      --secondary:#5FB8E8;
      --ok:#3FCB78;
      --ok-bg:rgba(63,203,120,0.14);
      --warn:#E5695C;
      --warn-bg:rgba(229,105,92,0.14);
      --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 10px 24px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#071B30;
    --surface:#0E2A47;
    --surface2:#123353;
    --ink:#EAF3FB;
    --muted:#8FB0CC;
    --line:#1D4468;
    --accent:#22B2EA;
    --accent-ink:#04263F;
    --secondary:#5FB8E8;
    --ok:#3FCB78;
    --ok-bg:rgba(63,203,120,0.14);
    --warn:#E5695C;
    --warn-bg:rgba(229,105,92,0.14);
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 10px 24px rgba(0,0,0,0.35);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  svg{ width:18px; height:18px; flex:none; vertical-align:-3px; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans KR','Malgun Gothic',sans-serif;
    display:flex;
    justify-content:center;
    padding-block:0;
  }

  .phone{
    width:100%;
    max-width:460px;
    min-height:100dvh;
    background:var(--surface);
    display:flex;
    flex-direction:column;
    position:relative;
    box-shadow:var(--shadow);
  }

  header.appbar{
    background:var(--ink);
    color:var(--bg);
    padding:20px 20px 16px;
    flex:0 0 auto;
  }
  header.appbar .brand-row{
    display:flex; justify-content:center; margin-bottom:16px;
  }
  header.appbar .brand-badge{
    background:#FFFFFF;
    border-radius:14px;
    padding:12px 24px;
    display:flex; align-items:center;
    box-shadow:0 4px 14px rgba(0,0,0,0.18);
  }
  header.appbar .brand-badge img{ display:block; height:50px; width:auto; }
  header.appbar .title{
    display:flex; align-items:center; gap:10px;
    font-size:18px; font-weight:700;
  }
  header.appbar .title svg{ width:22px; height:22px; color:var(--accent); }
  header.appbar .sub{ margin-top:6px; font-size:12.5px; color:#C7CEDA; }

  main{
    flex:1 1 auto;
    overflow-y:auto;
    padding:16px 16px 90px;
  }

  nav.tabbar{
    position:absolute; left:0; right:0; bottom:0;
    display:flex;
    background:var(--surface);
    border-top:1px solid var(--line);
    padding:6px 6px calc(6px + env(safe-area-inset-bottom));
  }
  nav.tabbar button{
    flex:1;
    background:none; border:none; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:8px 2px;
    color:var(--muted);
    font-family:inherit; font-size:11px;
    border-radius:10px;
  }
  nav.tabbar button svg{ width:21px; height:21px; }
  nav.tabbar button.active{ color:var(--ink); background:var(--surface2); }
  nav.tabbar button.active svg{ color:var(--accent); }

  h1.page-title{ font-size:19px; font-weight:700; margin:2px 0 14px; }

  .stat-row{ display:flex; gap:10px; margin-bottom:16px; }
  .stat-card{
    flex:1; background:var(--surface2); border-radius:14px; padding:12px 12px;
  }
  .stat-card .num{ font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; }
  .stat-card .num.warn{ color:var(--warn); }
  .stat-card .label{ font-size:11.5px; color:var(--muted); margin-top:2px; }

  .section-label{
    font-size:12px; font-weight:700; color:var(--muted);
    letter-spacing:.02em; margin:18px 0 8px;
  }

  .quick-row{ display:flex; gap:10px; }
  .quick-btn{
    flex:1; border:none; border-radius:14px; padding:16px 10px;
    display:flex; flex-direction:column; align-items:center; gap:6px;
    font-family:inherit; font-weight:700; font-size:13.5px; cursor:pointer;
  }
  .quick-btn.in{ background:var(--accent); color:var(--accent-ink); }
  .quick-btn.out{ background:var(--ink); color:var(--bg); }
  .quick-btn svg{ width:22px; height:22px; }

  .part-card{
    display:flex; align-items:center; gap:12px;
    background:var(--surface2); border-radius:14px; padding:12px 12px;
    margin-bottom:9px; cursor:pointer;
  }
  .part-card .info{ flex:1; min-width:0; }
  .part-card .name{ font-weight:700; font-size:14.5px; }
  .part-card .meta{ font-size:12px; color:var(--muted); margin-top:2px; }
  .pill{
    font-size:11.5px; font-weight:700; padding:4px 9px; border-radius:999px;
    white-space:nowrap;
  }
  .pill.ok{ background:var(--ok-bg); color:var(--ok); }
  .pill.warn{ background:var(--warn-bg); color:var(--warn); }

  .empty-note{ color:var(--muted); font-size:13px; padding:10px 2px; }

  input, textarea{
    width:100%; font-family:inherit; font-size:14.5px; color:var(--ink);
    background:var(--surface2); border:1px solid var(--line); border-radius:10px;
    padding:11px 12px; margin-bottom:10px;
  }
  input:focus, textarea:focus{ outline:2px solid var(--accent); outline-offset:-1px; }
  label.field-label{ font-size:12.5px; font-weight:700; color:var(--muted); display:block; margin:0 0 5px; }

  .btn{
    width:100%; border:none; border-radius:12px; padding:13px 14px;
    font-family:inherit; font-weight:700; font-size:14.5px; cursor:pointer;
  }
  .btn.primary{ background:var(--accent); color:var(--accent-ink); }
  .btn.dark{ background:var(--ink); color:var(--bg); }
  .btn.ghost{ background:var(--surface2); color:var(--ink); }

  .search-box{ position:relative; margin-bottom:14px; }
  .search-box svg{
    position:absolute; left:12px; top:50%; transform:translateY(-50%);
    width:17px; height:17px; color:var(--muted);
  }
  .search-box input{ padding-left:36px; margin-bottom:0; }

  .scan-wrap{
    position:relative; width:100%; max-width:260px; margin:0 auto; aspect-ratio:1/1; border-radius:16px;
    overflow:hidden; background:#000;
  }
  .scan-wrap video{ width:100%; height:100%; object-fit:cover; }
  .scan-frame{
    position:absolute; inset:14%; border:3px solid var(--accent); border-radius:16px;
    box-shadow:0 0 0 999px rgba(0,0,0,0.32);
  }
  .scan-idle{
    width:100%; max-width:260px; margin:0 auto; aspect-ratio:1/1; border-radius:16px; background:var(--surface2);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    color:var(--muted); text-align:center; padding:20px;
  }
  .scan-idle svg{ width:38px; height:38px; color:var(--secondary); }

  .manual-scan-box{
    width:100%; box-sizing:border-box; border-radius:16px; background:var(--surface2);
    border:2px solid var(--line);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:12px; padding:34px 20px; text-align:center; transition:border-color .15s, background .15s;
  }
  .manual-scan-box.focused{ border-color:var(--accent); background:var(--surface); }
  .manual-scan-box svg{ width:40px; height:40px; color:var(--secondary); flex:none; }
  .manual-scan-box .msb-title{ font-weight:700; font-size:15.5px; color:var(--ink); }
  .manual-scan-box input{
    width:100%; font-size:19px; font-weight:700; text-align:center;
    padding:16px 14px; margin-bottom:0; border-radius:12px;
  }
  .manual-scan-box .btn{ width:100%; padding:14px; font-size:15px; }

  .mode-toggle{ display:flex; background:var(--surface2); border-radius:12px; padding:4px; margin-bottom:14px; }
  .mode-toggle button{
    flex:1; border:none; background:none; padding:10px; border-radius:9px;
    font-family:inherit; font-weight:700; font-size:13.5px; color:var(--muted); cursor:pointer;
  }
  .mode-toggle button.active.in{ background:var(--accent); color:var(--accent-ink); }
  .mode-toggle button.active.out{ background:var(--ink); color:var(--bg); }

  .sheet-backdrop{
    position:absolute; inset:0; background:rgba(13,17,23,0.5);
    display:flex; align-items:flex-end; z-index:20;
  }
  .sheet{
    width:100%; background:var(--surface); border-radius:20px 20px 0 0;
    padding:18px 18px calc(18px + env(safe-area-inset-bottom));
    max-height:86%; overflow-y:auto;
  }
  .sheet .handle{ width:36px; height:4px; background:var(--line); border-radius:99px; margin:0 auto 14px; }
  .sheet h2{ font-size:17px; margin:0 0 3px; }
  .sheet .sub-meta{ font-size:12.5px; color:var(--muted); margin-bottom:14px; }

  .stepper{ display:flex; align-items:center; gap:12px; margin-bottom:14px; }
  .stepper button{
    width:42px; height:42px; border-radius:11px; border:none; background:var(--surface2);
    font-size:20px; font-weight:700; color:var(--ink); cursor:pointer;
  }
  .stepper input{ text-align:center; margin-bottom:0; font-weight:700; font-size:17px; }

  .toast{
    position:absolute; left:16px; right:16px; bottom:96px; z-index:30;
    background:var(--ink); color:var(--bg); padding:12px 16px; border-radius:12px;
    font-size:13.5px; font-weight:600; box-shadow:var(--shadow);
    display:flex; align-items:center; gap:8px;
  }
  .toast svg{ width:16px; height:16px; color:var(--accent); flex:0 0 auto; }
  .toast-action{
    flex:0 0 auto; background:none; border:none; color:var(--accent);
    font-family:inherit; font-weight:700; font-size:13px; cursor:pointer; padding:2px 0 2px 8px;
  }

  .hist-row{ position:relative; }
  .hist-row .undo-btn{
    background:none; border:none; color:var(--secondary); font-family:inherit;
    font-size:11.5px; font-weight:700; cursor:pointer; padding:2px 0 2px 8px;
  }
  .hist-row.is-reversed{ opacity:.5; }
  .hist-row .reversed-tag{ font-size:11px; color:var(--muted); padding-left:8px; }

  .row-between{ display:flex; align-items:center; justify-content:space-between; }
  .link-btn{ background:none; border:none; color:var(--secondary); font-family:inherit; font-weight:700; font-size:12.5px; cursor:pointer; padding:4px; }
  .link-btn.danger{ color:var(--warn); }

  .delete-part-row{ display:flex; justify-content:center; margin-top:12px; }
  .delete-part-row button{ background:none; border:none; color:var(--warn); font-family:inherit; font-weight:700; font-size:12.5px; cursor:pointer; padding:8px; display:flex; align-items:center; gap:5px; }
  .delete-part-row button svg{ width:14px; height:14px; }

  .qr-box{ background:#fff; border-radius:14px; padding:16px; display:flex; justify-content:center; margin:6px 0 12px; }

  #printLabel{ position:fixed; left:-9999px; top:-9999px; text-align:center; }
  #printLabel .print-qr-box{ display:flex; justify-content:center; }
  #printLabel .print-name{ font-size:19px; font-weight:700; margin-top:14px; color:#000; }
  #printLabel .print-code{ font-size:15px; letter-spacing:.04em; margin-top:4px; color:#000; }
  #printLabel .print-meta{ font-size:12.5px; color:#444; margin-top:3px; }
  #printLabel .print-label-block{ padding-top:24px; }
  #printLabel .print-label-block + .print-label-block{ page-break-before:always; }
  @media print{
    body{ background:#fff; }
    body *{ visibility:hidden; }
    #printLabel, #printLabel *{ visibility:visible; }
    #printLabel{ position:absolute; left:0; top:0; width:100%; }
  }

  .part-card.selectable{ cursor:pointer; }
  .select-check{
    width:22px; height:22px; border-radius:7px; flex:0 0 auto;
    border:2px solid var(--line); background:var(--surface);
    display:flex; align-items:center; justify-content:center; color:#fff;
  }
  .select-check svg{ width:13px; height:13px; }
  .part-card.selected{ outline:2px solid var(--accent); outline-offset:-2px; }
  .part-card.selected .select-check{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }

  .select-bar{
    position:absolute; left:16px; right:16px; bottom:78px; z-index:25;
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:10px 10px 10px 16px; display:flex; align-items:center; justify-content:space-between;
    box-shadow:var(--shadow);
  }
  .select-bar span{ font-size:12.5px; font-weight:700; color:var(--muted); }
  .select-bar button svg{ width:15px; height:15px; }

  .hist-row{ display:flex; justify-content:space-between; font-size:12.5px; padding:7px 0; border-bottom:1px solid var(--line); }
  .hist-row:last-child{ border-bottom:none; }
  .hist-row .t{ color:var(--muted); }
  .hist-row .d.in{ color:var(--ok); font-weight:700; }
  .hist-row .d.out{ color:var(--warn); font-weight:700; }

  .banner{
    background:var(--surface2); border-radius:12px; padding:10px 12px;
    font-size:12px; color:var(--muted); margin-bottom:14px; display:flex; gap:8px; align-items:flex-start;
  }
  .banner svg{ width:15px; height:15px; flex:0 0 auto; margin-top:1px; color:var(--secondary); }

  .parts-actions{ display:flex; gap:14px; align-items:center; }

  .import-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:9px 0; border-bottom:1px solid var(--line);
  }
  .import-row:last-of-type{ border-bottom:none; }
  .import-row .import-field{ font-size:13px; font-weight:700; color:var(--ink); flex:0 0 auto; min-width:88px; }
  .import-row .import-req{ color:var(--warn); }
  .import-row select{
    flex:1; margin-bottom:0; font-size:13px; padding:9px 10px;
    background:var(--surface2); border:1px solid var(--line); border-radius:10px;
    color:var(--ink); font-family:inherit;
  }
  .import-preview{
    margin-top:14px; border:1px solid var(--line); border-radius:12px; overflow:hidden;
  }
  .import-preview-head{
    padding:9px 12px; font-size:11.5px; font-weight:700; color:var(--muted);
    background:var(--surface2); border-bottom:1px solid var(--line);
  }
  .import-preview table{ width:100%; border-collapse:collapse; font-size:12px; }
  .import-preview th, .import-preview td{
    padding:7px 10px; text-align:left; border-bottom:1px solid var(--line);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:120px;
  }
  .import-preview th{ color:var(--muted); font-weight:700; background:var(--surface2); }
  .import-preview tr:last-child td{ border-bottom:none; }
  .import-summary{ font-size:12.5px; color:var(--muted); margin-top:10px; }
  .import-error{ color:var(--warn); font-size:12.5px; margin-top:8px; }
</style>

</head>

<script>
  // 이 페이지는 순수 독립 호스팅(예: 깃허브 페이지)에서 서비스되는 완전한 정적 파일이다.
  // 데이터는 구글 앱스 스크립트를 "JSON API"로 배포한 아래 주소에 fetch()로 요청해서 받아온다.
  // (Apps Script를 HtmlService로 직접 열면 자체 보안 샌드박스에 페이지가 감싸여 카메라 접근이
  // 막히는 것을 확인했기 때문에, 화면은 반드시 이렇게 감싸이지 않는 곳에서 서비스해야 한다.)
  var API_URL = 'https://script.google.com/macros/s/AKfycbyOguh0SRjkMajnqQRqFBqqbhai7wiUEB7nkc5gTMUHfd0jlar7jCinSPPpkaSVTHwA/exec';
</script>

<script>
(function(){
  // ---------- icon helpers ----------
  const ICONS = {
    plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
    x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
    back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>',
    alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.6 1.8 18a1.5 1.5 0 0 0 1.3 2.2h17.8a1.5 1.5 0 0 0 1.3-2.2L13.7 3.6a1.5 1.5 0 0 0-2.6 0Z"/><path d="M12 9v4M12 16.5h.01"/></svg>',
    down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v13M6 12l6 6 6-6"/></svg>',
    up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V6M6 12l6-6 6 6"/></svg>',
    camera: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M8 6 9.5 4h5L16 6"/><circle cx="12" cy="12.5" r="3.3"/></svg>',
    info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
    print: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>',
    upload: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>',
    edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
    download: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>',
    barcode: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 5v14M7 5v14M10 5v14M13 5v14M15 5v14M18 5v14M21 5v14" stroke-width="1.6"/></svg>',
    refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v6h-6"/></svg>',
  };

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  // ---------- 한/영 오타 자동 복구 ----------
  // PC에 USB QR/바코드 스캐너를 연결해 쓸 때, 스캐너는 코드를 정확히 읽어도
  // 그걸 "키보드 입력"으로 흉내내서 넘기기 때문에, 윈도우의 입력기가 한글(2벌식)로
  // 켜져 있으면 영문 코드가 엉뚱한 한글로 조합되어 들어온다 (예: "SP" -> "네").
  // 등록된 코드와 바로 매치가 안 되고 한글이 섞여 있으면, 2벌식 자모->키 역매핑으로
  // 원래 영문 입력이 뭐였을지 복원해서 한 번 더 찾아본다.
  const HANGUL_CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  const HANGUL_JUNG = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
  const HANGUL_JONG = ['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  const JAMO_TO_KEY = {
    'ㄱ':'r','ㄲ':'rr','ㄴ':'s','ㄷ':'e','ㄸ':'ee','ㄹ':'f','ㅁ':'a','ㅂ':'q','ㅃ':'qq',
    'ㅅ':'t','ㅆ':'tt','ㅇ':'d','ㅈ':'w','ㅉ':'ww','ㅊ':'c','ㅋ':'z','ㅌ':'x','ㅍ':'v','ㅎ':'g',
    'ㅏ':'k','ㅐ':'o','ㅑ':'i','ㅒ':'o','ㅓ':'j','ㅔ':'p','ㅕ':'u','ㅖ':'p',
    'ㅗ':'h','ㅘ':'hk','ㅙ':'ho','ㅚ':'hl','ㅛ':'y',
    'ㅜ':'n','ㅝ':'nj','ㅞ':'np','ㅟ':'nl','ㅠ':'b','ㅡ':'m','ㅢ':'ml','ㅣ':'l',
    'ㄳ':'rt','ㄵ':'sw','ㄶ':'sg','ㄺ':'fr','ㄻ':'fa','ㄼ':'fq','ㄽ':'ft','ㄾ':'fx','ㄿ':'fv','ㅀ':'fg','ㅄ':'qt'
  };
  function dehangulize(str){
    let out = '';
    for(const ch of String(str)){
      const cp = ch.codePointAt(0);
      if(cp >= 0xAC00 && cp <= 0xD7A3){
        const idx = cp - 0xAC00;
        const cho = HANGUL_CHO[Math.floor(idx / (21*28))];
        const jung = HANGUL_JUNG[Math.floor((idx % (21*28)) / 28)];
        const jong = HANGUL_JONG[idx % 28];
        out += (JAMO_TO_KEY[cho]||'') + (JAMO_TO_KEY[jung]||'') + (jong ? (JAMO_TO_KEY[jong]||'') : '');
      } else {
        out += ch;
      }
    }
    return out;
  }
  function fmtTime(iso){
    if(!iso) return '';
    const d = new Date(iso);
    if(isNaN(d.getTime())) return '';
    return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  }

  // ---------- store (Google Sheet backed, via fetch() to the Apps Script JSON API) ----------
  // 이 페이지는 독립 호스팅에서 서비스되는 완전한 정적 파일이라 google.script.run을 쓸 수
  // 없다 — 대신 배포된 Apps Script 웹앱(API_URL)에 순수 fetch()로 요청한다. Apps Script가
  // 브라우저의 CORS 사전 확인(OPTIONS preflight) 요청을 처리하지 못하므로, preflight 자체가
  // 발생하지 않도록 조회는 커스텀 헤더 없는 단순 GET으로, 쓰기는 Content-Type을
  // "text/plain"으로 보내는 단순 POST로 요청한다(서버에서 문자열을 그대로 JSON.parse한다).
  // 실시간 구독 대신, 짧은 주기로 폴링(refresh)해서 다른 기기에서 생긴 변경사항을 반영한다.
  // onChange()/emit() 구독 계약은 기존과 동일하게 유지한다.
  const REFRESH_INTERVAL_MS = 10000;

  function apiGet(action, params){
    const url = new URL(API_URL);
    url.searchParams.set('action', action);
    Object.keys(params||{}).forEach(k=>{ if(params[k]!==undefined) url.searchParams.set(k, params[k]); });
    return fetch(url.toString(), { method:'GET' })
      .then(r=>r.json())
      .then(res=>{
        if(!res || !res.ok) throw new Error((res && res.error) || '서버 응답 오류');
        return res.data;
      });
  }

  function apiPost(action, data){
    return fetch(API_URL, {
      method:'POST',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action:action }, data||{}))
    })
      .then(r=>r.json())
      .then(res=>{
        if(!res || !res.ok) throw new Error((res && res.error) || '서버 응답 오류');
        return res.data;
      });
  }

  const Store = {
    ready: false,
    parts: [],   // {code, name, spec, maker, equipment, location, qty, minQty, unit, updatedAt}
    logs: [],    // {id, at, type, code, partName, qty, note, reversed}
    lastError: null,
    lastRefreshAt: null,
    listeners: [],
    _lastPartsJson: null,
    _lastLogsJson: null,
    onChange(fn){ this.listeners.push(fn); },
    emit(){ this.listeners.forEach(fn=>fn()); },

    init(){
      this.emit();
      const first = this.refresh();
      setInterval(()=>this.refresh(), REFRESH_INTERVAL_MS);
      return first;
    },

    // 주기적 폴링(10초마다)이 "데이터가 실제로 바뀌었을 때만" 화면을 다시 그리도록
    // 한다. 그렇지 않으면 스캔 탭에서 카메라를 켜놓고 있어도 10초마다 renderScan()이
    // 다시 실행되어 카메라 스트림이 매번 재시작되고, 다른 탭에서는 입력 중이던 폼
    // 내용이나 스크롤 위치, 포커스가 아무 변화도 없는데 주기적으로 날아가 버린다.
    refresh(){
      return apiGet('getAllData').then((data)=>{
        const newPartsJson = JSON.stringify((data && data.parts) || []);
        const newLogsJson = JSON.stringify((data && data.logs) || []);
        const wasReady = this.ready;
        const changed = newPartsJson !== this._lastPartsJson || newLogsJson !== this._lastLogsJson;
        this.parts = (data && data.parts) || [];
        this.logs = (data && data.logs) || [];
        this._lastPartsJson = newPartsJson;
        this._lastLogsJson = newLogsJson;
        this.lastError = null;
        this.lastRefreshAt = new Date().toISOString();
        this.ready = true;
        if(changed || !wasReady) this.emit();
        return data;
      }).catch((err)=>{
        this.lastError = (err && err.message) ? err.message : String(err);
        this.emit();
        return null;
      });
    },

    nextCode(){
      let max = 0;
      this.parts.forEach(p=>{
        const m = /^SP-(\d+)$/.exec(p.code||'');
        if(m) max = Math.max(max, parseInt(m[1],10));
      });
      return 'SP-' + String(max+1).padStart(4,'0');
    },

    addPart(data){
      return apiPost('addPart', { data:data }).then((part)=>this.refresh().then(()=>part));
    },

    updatePart(code, data){
      return apiPost('updatePart', { code:code, data:data }).then((part)=>this.refresh().then(()=>part));
    },

    deletePart(code){
      return apiPost('deletePart', { code:code }).then((res)=>this.refresh().then(()=>res));
    },

    applyTx(code, type, qty, note){
      return apiPost('applyTx', { code:code, type:type, qty:qty, note:note||'' }).then((res)=>this.refresh().then(()=>res));
    },

    reverseLog(logId){
      return apiPost('reverseLog', { logId:logId }).then((res)=>this.refresh().then(()=>res));
    },

    bulkImportParts(rows){
      return apiPost('bulkImportParts', { rows:rows }).then((res)=>this.refresh().then(()=>res));
    },

    findByCode(code){
      const norm = String(code).trim().toLowerCase();
      let p = this.parts.find(p => (p.code||'').toLowerCase() === norm);
      if(p) return p;
      // 직접 매치가 안 되고 한글이 섞여 있으면, 한/영 오타(2벌식 역변환)로 복구를 시도한다.
      if(/[가-힣ㄱ-ㅎㅏ-ㅣ]/.test(code)){
        const reconverted = dehangulize(code).trim().toLowerCase();
        if(reconverted && reconverted !== norm){
          p = this.parts.find(p => (p.code||'').toLowerCase() === reconverted);
          if(p) return p;
        }
      }
      return null;
    },

    historyFor(code){
      return this.logs.filter(l=>l.code===code).slice(0,8);
    }
  };

  function errMsg(err){
    return (err && err.message) ? err.message : String(err||'알 수 없는 오류가 발생했습니다.');
  }

  // ---------- app state / router ----------
  const App = { tab:'home', homeLowAll:false, partsSelectMode:false, selectedParts:new Set() };
  const HOME_LOW_PREVIEW = 4;

  function partCodeNum(code){
    const m = /^SP-(\d+)$/.exec(code||'');
    return m ? parseInt(m[1],10) : Infinity;
  }
  function byCode(a,b){
    const na = partCodeNum(a.code), nb = partCodeNum(b.code);
    if(na!==nb) return na-nb;
    return (a.code||'').localeCompare(b.code||'');
  }

  // 부품 검색 화면 정렬용: 품명 기준으로 가나다순 -> 영문 A-Z -> 숫자 순.
  function nameCharGroup(ch){
    if(!ch) return 3;
    if(/[가-힣ㄱ-ㅎㅏ-ㅣ]/.test(ch)) return 0;
    if(/[A-Za-z]/.test(ch)) return 1;
    if(/[0-9]/.test(ch)) return 2;
    return 3;
  }
  function byNameKoEnNum(a,b){
    const an = (a.name||'').trim(), bn = (b.name||'').trim();
    const ga = nameCharGroup(an[0]), gb = nameCharGroup(bn[0]);
    if(ga !== gb) return ga - gb;
    if(ga === 2) return an.localeCompare(bn, 'en', { numeric:true });
    return an.localeCompare(bn, ga===0 ? 'ko' : 'en');
  }
  const $main = document.getElementById('main');
  const $phone = document.getElementById('phone');

  document.getElementById('tabbar').addEventListener('click', e=>{
    const btn = e.target.closest('button[data-tab]');
    if(!btn) return;
    stopScanner();
    App.tab = btn.dataset.tab;
    render();
  });

  Store.onChange(()=>{ render(); });

  function setTab(t){ stopScanner(); App.tab = t; render(); }

  function showToast(msg, icon, action){
    const el = document.createElement('div');
    el.className = 'toast';
    el.innerHTML = (icon||ICONS.check) + '<span style="flex:1;">'+esc(msg)+'</span>'
      + (action ? '<button class="toast-action">'+esc(action.label)+'</button>' : '');
    $phone.appendChild(el);
    const timer = setTimeout(()=>{ el.remove(); }, action ? 5000 : 2600);
    if(action){
      el.querySelector('.toast-action').onclick = ()=>{
        clearTimeout(timer);
        el.remove();
        action.onClick();
      };
    }
  }

  // ---------- 바코드 스캐너 포커스 감지 ----------
  // USB 바코드 스캐너는 사람이 타이핑하는 것보다 훨씬 빠른 속도로 키 입력을 쏟아낸다.
  // "코드 직접 입력" 칸에 포커스가 없는 상태에서 이런 빠른 입력이 들어오면, 스캔은
  // 됐지만 입력칸을 못 찾아 그냥 씹혔을 가능성이 높으므로 안내 토스트를 띄워준다.
  let scanBurstBuf = [];
  document.addEventListener('keydown', e=>{
    if(App.tab !== 'scan') return;
    const manualInput = document.getElementById('manualCodeInput');
    if(!manualInput || document.activeElement === manualInput) return; // 정상 입력 중
    if(e.key.length !== 1 && e.key !== 'Enter') return;
    const now = performance.now();
    scanBurstBuf = scanBurstBuf.filter(t => now - t < 700);
    scanBurstBuf.push(now);
    if(scanBurstBuf.length >= 4){
      const gaps = [];
      for(let i=1;i<scanBurstBuf.length;i++) gaps.push(scanBurstBuf[i]-scanBurstBuf[i-1]);
      const avgGap = gaps.reduce((a,b)=>a+b,0)/gaps.length;
      if(avgGap < 40){
        showToast('바코드 스캐너 입력을 놓쳤어요. "코드 직접 입력" 칸을 클릭해 포커스를 둔 뒤 다시 스캔해주세요.', ICONS.alert);
      }
      scanBurstBuf = [];
    }
  });

  // ---------- render ----------
  function render(){
    document.querySelectorAll('#tabbar button').forEach(b=>{
      b.classList.toggle('active', b.dataset.tab===App.tab);
    });
    if(App.tab==='home') return renderHome();
    if(App.tab==='scan') return renderScan();
    if(App.tab==='search') return renderSearch();
    if(App.tab==='parts') return renderParts();
  }

  function renderHome(){
    const total = Store.parts.length;
    const low = Store.parts.filter(p=>(p.qty||0) <= (p.minQty||0));
    const todayStr = new Date().toDateString();
    const todayLogs = Store.logs.filter(l=> new Date(l.at).toDateString()===todayStr);
    const todayIn = todayLogs.filter(l=>l.type==='in').length;
    const todayOut = todayLogs.filter(l=>l.type==='out').length;

    let html = '';
    html += errorBanner();
    html += '<h1 class="page-title">스페어파트 현황</h1>';
    html += refreshStatusRow();
    html += '<div class="stat-row">';
    html += statCard(total, '등록 부품');
    html += statCard(low.length, '재고 부족', low.length>0);
    html += statCard(todayIn, '오늘 입고');
    html += statCard(todayOut, '오늘 출고');
    html += '</div>';

    html += '<div class="quick-row">';
    html += '<button class="quick-btn in" data-act="go-scan" style="flex:1;">'+ICONS.down+'QR 스캔 (입고/출고)</button>';
    html += '</div>';

    html += '<div class="row-between">';
    html += '<div class="section-label" style="margin-bottom:0;">재고 부족 부품</div>';
    if(low.length > HOME_LOW_PREVIEW){
      html += '<button class="link-btn" id="toggleLowBtn">'+(App.homeLowAll ? '접기' : '더보기 ('+low.length+')')+'</button>';
    }
    html += '</div>';
    if(low.length===0){
      html += '<div class="empty-note">부족한 부품이 없습니다.</div>';
    }else{
      const lowList = App.homeLowAll ? low : low.slice(0, HOME_LOW_PREVIEW);
      lowList.forEach(p=>{ html += partCard(p); });
    }

    html += '<div class="section-label">최근 입출고</div>';
    if(Store.logs.length===0){
      html += '<div class="empty-note">아직 입출고 기록이 없습니다.</div>';
    }else{
      html += '<div style="background:var(--surface2);border-radius:14px;padding:4px 12px;">';
      Store.logs.slice(0,6).forEach(l=>{
        html += '<div class="hist-row"><span>'+esc(l.partName)+'</span><span class="t">'+fmtTime(l.at)+'&nbsp; <span class="d '+l.type+'">'+(l.type==='in'?'+':'-')+l.qty+'</span></span></div>';
      });

  // ---------- scan tab ----------
  let stream = null, rafId = null, scanLocked = false;

  function renderScan(){
    let html = '';

    html += '<div class="empty-note" style="padding-top:0;margin-top:-8px;margin-bottom:10px;">스캔 후 +/- 로 입고·출고를 한번에 처리합니다.</div>';

    html += '<div class="section-label">코드 직접 입력 · 바코드 스캐너</div>';

      + ICONS.barcode
      + '<div class="msb-title">카메라가 없거나 권한을 허용하지 않았다면<br>여기에 코드를 붙여넣기·입력하거나, USB 바코드 스캐너로 스캔하세요</div>'
      + '<input id="manualCodeInput" placeholder="예: SP-0031">'
      + '<button class="btn primary" id="manualCodeBtn">확인</button>'
      + '</div>';
    html += '<div class="empty-note" style="padding-top:0;"><b>PC에서:</b> USB QR/바코드 스캐너가 있다면 위 입력칸에 포커스를 둔 채로 스캔하면 자동 인식됩니다.<br>스캐너가 없어도 코드를 직접 타이핑해서 처리할 수 있어요.</div>';

    html += '<div class="section-label">최근 스캔 처리</div>';
    if(Store.logs.length===0){
      html += '<div class="empty-note">아직 처리한 스캔이 없습니다.</div>';
    }else{
      html += '<div style="background:var(--surface2);border-radius:14px;padding:4px 12px;">';
      Store.logs.slice(0,5).forEach(l=>{
        html += '<div class="hist-row"><span>'+esc(l.partName)+'</span><span class="t">'+fmtTime(l.at)+'&nbsp; <span class="d '+l.type+'">'+(l.type==='in'?'+':'-')+l.qty+'</span></span></div>';
      });
      html += '</div>';
    }

    $main.innerHTML = html;

    const manualInput = $main.querySelector('#manualCodeInput');
    const manualBtn = $main.querySelector('#manualCodeBtn');
    const manualBox = $main.querySelector('#manualScanBox');
    function submitManualCode(){
      const code = manualInput.value.trim();
      if(!code) return;
      manualInput.value = '';
      onScanResult(code);
    }
    manualBtn.onclick = submitManualCode;
    manualInput.addEventListener('keydown', e=>{
      if(e.key === 'Enter'){ e.preventDefault(); submitManualCode(); }
    });
    // 폰에서 카메라 앱으로 스캔한 텍스트를 복사해와 붙여넣는 경우, 붙여넣자마자
    // 바로 처리되도록 한다 (확인 버튼을 한 번 더 누를 필요 없이).
    manualInput.addEventListener('paste', ()=>{
      setTimeout(submitManualCode, 0);
    });
    // 입력칸에 포커스가 있을 때 박스 테두리를 강조해서, 스캐너로 찍기 전에
    // 포커스가 제대로 들어가 있는지 눈으로 바로 확인할 수 있게 한다.
    manualInput.addEventListener('focus', ()=>{ if(manualBox) manualBox.classList.add('focused'); });
    manualInput.addEventListener('blur', ()=>{ if(manualBox) manualBox.classList.remove('focused'); });
    // auto-focus only on mouse/keyboard devices (PC), so a USB scanner can type into it right away
    // (폰에서는 카메라가 기본 스캔 수단이므로 굳이 입력칸에 포커스를 뺏지 않는다)
    if(window.matchMedia && window.matchMedia('(pointer: fine)').matches){
      manualInput.focus();
    }

    startScanner();
  }

  function renderScanPaused(){
    const area = document.getElementById('scanArea');
    if(!area) return;
    area.innerHTML = '<div class="scan-idle">'+ICONS.camera
      + '<div>카메라가 꺼져 있습니다.</div>'
      + '<button class="btn primary" id="resumeScanBtn" style="width:auto;padding:11px 22px;">'+ICONS.camera+' 카메라 다시 시작</button>'
      + '</div>';
    const rb = document.getElementById('resumeScanBtn');
    if(rb) rb.onclick = startScanner;
  }

  async function startScanner(){
    const area = document.getElementById('scanArea');
    if(!area) return;
    area.innerHTML = '<div class="scan-wrap"><video id="scanVideo" playsinline muted autoplay></video><div class="scan-frame"></div></div>'
      + '<div class="empty-note" style="text-align:center;margin-top:8px;">박스 안에 QR코드 1개만 맞춰주세요 (라벨이 여러 개 붙어있으면 나머지는 가려주세요)</div>'
      + '<button class="btn ghost" id="stopScanBtn" style="margin-top:10px;">'+ICONS.x+' 카메라 중지</button>';
    document.getElementById('stopScanBtn').onclick = ()=>{ stopScanner(); renderScanPaused(); };

    try{
      try{
        // facingMode는 폰에서만 의미가 있고 PC 웹캠에서는 무시됨. PC 웹캠은 보통 근접 촛점이
        // 잘 안 맞는 경우가 많아서, 지원하는 브라우저/카메라에 한해 연속 자동초점을 요청한다
        // (미지원 카메라는 advanced 항목이라 에러 없이 무시되는 게 정상이지만, 혹시 이 조건
        // 때문에 실패하는 카메라가 있을 수 있어 더 단순한 조건으로 한 번 더 시도한다).
        stream = await navigator.mediaDevices.getUserMedia({ video:{
          facingMode:'environment',
          width:{ ideal:1920 }, height:{ ideal:1080 },
          advanced:[{ focusMode:'continuous' }]
        } });
      }catch(err1){
        stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' } });
      }
    }catch(err){
      let reason = '브라우저 권한을 확인해주세요.';
      if(err && (err.name==='NotFoundError' || err.name==='DevicesNotFoundError')) reason = '이 기기에서 카메라를 찾을 수 없습니다. 아래 "코드 직접 입력" 칸을 이용해주세요.';
      else if(err && (err.name==='NotAllowedError' || err.name==='PermissionDeniedError')) reason = '카메라 권한이 차단되어 있습니다. 브라우저 주소창의 카메라 권한을 허용으로 바꿔주세요.';
      else if(err && err.name==='NotReadableError') reason = '다른 프로그램이 카메라를 사용 중인 것 같습니다. 카메라를 쓰는 다른 창/앱을 닫고 다시 시도해주세요.';
      area.innerHTML = '<div class="scan-idle">'+ICONS.alert+'<div>카메라를 사용할 수 없습니다.<br>'+esc(reason)+'</div>'
        + '<button class="btn primary" id="retryScanBtn" style="width:auto;padding:11px 22px;">다시 시도</button></div>';
      const rb = document.getElementById('retryScanBtn');
      if(rb) rb.onclick = startScanner;
      return;
    }

    const video = document.getElementById('scanVideo');
    if(!video) { stream.getTracks().forEach(t=>t.stop()); return; }
    video.srcObject = stream;
    scanLocked = false;

    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently:true });

    // 미등록 코드로 판정되는 오독을 줄이기 위해, 등록된 부품과 일치하지 않는 값은
    // 같은 값이 여러 프레임 연속으로 읽혀야만 최종 확정한다 (한 프레임의 일시적 오독으로
    // 바로 "등록되지 않은 QR" 화면으로 넘어가는 것을 방지).
    let unmatchedCode = null, unmatchedStreak = 0;
    const UNMATCHED_CONFIRM_FRAMES = 6;

    function tick(){
      if(!stream) return;
      if(video.readyState === video.HAVE_ENOUGH_DATA && !scanLocked){
        // 화면에 보이는 스캔 가이드 박스(.scan-frame, 정사각형 미리보기의 가운데 72%)와
        // 똑같은 영역만 잘라서 인식한다. 전체 프레임을 그대로 넘기면 가이드 박스 바깥,
        // 즉 인접한 다른 QR 라벨까지 함께 잡혀서 두 QR이 뒤섞여 잘못 인식되는 문제가 있었음.
        const vw = video.videoWidth, vh = video.videoHeight;
        const side = Math.min(vw, vh);
        const coverX = (vw - side) / 2;
        const coverY = (vh - side) / 2;
        const guideSide = side * 0.72;
        const guideX = coverX + side * 0.14;
        const guideY = coverY + side * 0.14;

        canvas.width = guideSide;
        canvas.height = guideSide;
        ctx.drawImage(video, guideX, guideY, guideSide, guideSide, 0, 0, guideSide, guideSide);
        try{
          const img = ctx.getImageData(0,0,canvas.width,canvas.height);
          const code = window.jsQR ? window.jsQR(img.data, img.width, img.height, { inversionAttempts:'attemptBoth' }) : null;
          if(code && code.data){
            const part = Store.findByCode(code.data);
            if(part){
              // 등록된 부품 코드와 일치 -> 즉시 확정 (오탐 가능성이 매우 낮음)
              scanLocked = true;
              unmatchedCode = null; unmatchedStreak = 0;
              onScanResult(code.data);
            } else if(code.data === unmatchedCode){
              unmatchedStreak++;
              if(unmatchedStreak >= UNMATCHED_CONFIRM_FRAMES){
                scanLocked = true;
                onScanResult(code.data);
              }
            } else {
              unmatchedCode = code.data;
              unmatchedStreak = 1;
            }
          } else {
            unmatchedCode = null; unmatchedStreak = 0;
          }
        }catch(e){ /* frame not ready */ }
      }
      rafId = requestAnimationFrame(tick);
    }
    rafId = requestAnimationFrame(tick);
  }

  function stopScanner(){
    if(rafId) cancelAnimationFrame(rafId);
    rafId = null;
    if(stream){ stream.getTracks().forEach(t=>t.stop()); stream = null; }
    scanLocked = false;
  }

  // 라벨 QR에 순수 코드 대신 "https://.../exec?code=SP-0031" 형태의 딥링크가 인쇄되어
  // 있는 경우도 지원한다: 카메라나 붙여넣기로 이런 링크 텍스트가 들어오면 code 파라미터만
  // 뽑아서 조회한다.
  function extractCodeFromScan(raw){
    const s = String(raw||'').trim();
    if(/^https?:\/\//i.test(s)){
      try{
        const u = new URL(s);
        const c = u.searchParams.get('code');
        if(c) return c;
      }catch(e){ /* URL 파싱 실패시 원문 그대로 사용 */ }
    }
    return s;
  }

  function onScanResult(code){
    code = extractCodeFromScan(code);
    if(navigator.vibrate) navigator.vibrate(60);
    stopScanner();
    const part = Store.findByCode(code);
    if(!part){
      openUnknownCode(code);
      return;
    }
    openTxSheet(part);
  }

  function openTxSheet(part){
    const backdrop = document.createElement('div');
    backdrop.className = 'sheet-backdrop';
    const low = (part.qty||0) <= (part.minQty||0);
    const original = part.qty||0;
    backdrop.innerHTML = '<div class="sheet">'
      + '<div class="handle"></div>'
      + '<h2>'+esc(part.name)+'</h2>'
      + '<div class="sub-meta">'+esc(part.spec||'-')+' · '+esc(part.location||'-')+'</div>'
      + '<div class="row-between" style="margin-bottom:14px;">'
      +   '<span style="font-size:13px;color:var(--muted);">현재 재고</span>'
      +   '<span class="pill '+(low?'warn':'ok')+'">'+original+esc(part.unit||'')+'</span>'
      + '</div>'
      + '<label class="field-label">+/- 로 수량을 조절하세요 (입고·출고 자동 판단)</label>'
      + '<div class="stepper">'
      +   '<button id="stepMinus">−</button>'
      +   '<input id="txQty" type="number" min="0" value="'+original+'" inputmode="numeric">'
      +   '<button id="stepPlus">+</button>'
      + '</div>'
      + '<div id="txDiffLabel" class="row-between" style="margin:-4px 0 14px;">'
      +   '<span style="font-size:12.5px;color:var(--muted);">변경 후 재고</span>'
      +   '<span id="txDiffText" style="font-size:12.5px;font-weight:700;">변경 없음</span>'
      + '</div>'
      + '<label class="field-label">메모 (선택)</label>'
      + '<textarea id="txNote" rows="2" placeholder="예: 수리작업 #123"></textarea>'
      + '<button class="btn ghost" id="confirmTxBtn" disabled style="margin-bottom:9px;">수량을 조절하세요</button>'
      + '<button class="btn ghost" id="cancelTxBtn">취소</button>'
      + '</div>';
    $phone.appendChild(backdrop);

    const qtyInput = backdrop.querySelector('#txQty');
    const diffText = backdrop.querySelector('#txDiffText');
    const confirmBtn = backdrop.querySelector('#confirmTxBtn');

    function currentTarget(){ return Math.max(0, parseInt(qtyInput.value,10)||0); }

    function refresh(){
      const target = currentTarget();
      const diff = target - original;
      if(diff === 0){
        diffText.textContent = '변경 없음';
        diffText.style.color = 'var(--muted)';
        confirmBtn.className = 'btn ghost';
        confirmBtn.disabled = true;
        confirmBtn.innerHTML = '수량을 조절하세요';
      }else if(diff > 0){
        diffText.textContent = target+esc(part.unit||'')+' (입고 +'+diff+')';
        diffText.style.color = 'var(--ok)';
        confirmBtn.className = 'btn primary';
        confirmBtn.disabled = false;
        confirmBtn.innerHTML = ICONS.down+' 입고 확정 (+'+diff+')';
      }else{
        diffText.textContent = target+esc(part.unit||'')+' (출고 −'+(-diff)+')';
        diffText.style.color = 'var(--warn)';
        confirmBtn.className = 'btn dark';
        confirmBtn.disabled = false;
        confirmBtn.innerHTML = ICONS.up+' 출고 확정 (−'+(-diff)+')';
      }
    }

    backdrop.querySelector('#stepMinus').onclick = ()=>{ qtyInput.value = Math.max(0, currentTarget()-1); refresh(); };
    backdrop.querySelector('#stepPlus').onclick = ()=>{ qtyInput.value = currentTarget()+1; refresh(); };
    qtyInput.addEventListener('input', refresh);
    refresh();

    function close(){ backdrop.remove(); startScanner(); }
    backdrop.addEventListener('click', e=>{ if(e.target===backdrop) close(); });
    backdrop.querySelector('#cancelTxBtn').onclick = close;

    confirmBtn.onclick = async ()=>{
      const target = currentTarget();
      const diff = target - original;
      if(diff === 0) return;
      const mode = diff > 0 ? 'in' : 'out';
      const qty = Math.abs(diff);
      const note = backdrop.querySelector('#txNote').value.trim();
      confirmBtn.disabled = true;
      let res;
      try{
        res = await Store.applyTx(part.code, mode, qty, note);
      }catch(err){
        confirmBtn.disabled = false;
        alert(errMsg(err));
        return;
      }
      const newQty = res.part.qty;
      const logId = res.log.id;
      backdrop.remove();
      showToast(
        (mode==='in'?'입고 완료: ':'출고 완료: ')+part.name+' '+(mode==='in'?'+':'-')+qty+' (재고 '+newQty+esc(part.unit||'')+')',
        null,
        { label:'실수했어요, 되돌리기', onClick: async ()=>{
            try{
              await Store.reverseLog(logId);
              showToast('되돌렸습니다: '+part.name);
            }catch(err){ alert(errMsg(err)); }
          } }
      );
      startScanner();
    };
  }

  function renderParts(){
    const sorted = Store.parts.slice().sort(byNameKoEnNum);
    const selMode = App.partsSelectMode;
    const allSelected = sorted.length>0 && App.selectedParts.size===sorted.length;

  // ---------- excel import ----------
  const IMPORT_FIELDS = [
    { key:'name',   label:'품명',     required:true,  synonyms:['품명','제품명','품목명','부품명','name','품목'] },
    { key:'spec',   label:'규격',     required:false, synonyms:['규격','스펙','spec','사이즈'] },
    { key:'maker',  label:'메이커',   required:false, synonyms:['메이커','제조사','브랜드','maker','제조업체'] },
    { key:'equipment', label:'적용설비', required:false, synonyms:['적용설비','설비','기계','장비','equipment'] },
    { key:'location', label:'보관위치', required:false, synonyms:['보관위치','위치','창고','location'] },
    { key:'qty',    label:'현재수량', required:false, synonyms:['현재수량','재고수량','재고','수량','qty','stock'] },
    { key:'minQty', label:'안전재고', required:false, synonyms:['안전재고','최소수량','최소재고','minqty','안전수량'] },
    { key:'unit',   label:'단위',     required:false, synonyms:['단위','unit'] },
  ];

  function guessColumn(headers, synonyms){
    for(let i=0;i<headers.length;i++){
      const h = String(headers[i]||'').trim().toLowerCase();
      if(!h) continue;
      if(synonyms.some(s=>h.includes(s.toLowerCase()))) return i;
    }
    return -1;
  }

  function handleImportFile(file){
    if(!window.XLSX){
      alert('엑셀 처리 기능을 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 다시 시도해주세요.');
      return;
    }
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, {type:'array'});
        const sheetName = wb.SheetNames[0];
        const ws = wb.Sheets[sheetName];
        const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:'', blankrows:false});
        if(!rows.length){
          alert('엑셀 파일에서 데이터를 찾지 못했습니다.');
          return;
        }
        const headers = rows[0].map(h=>String(h||'').trim());
        const dataRows = rows.slice(1);
        if(!dataRows.length){
          alert('첫 번째 행(제목행) 외에 데이터가 없습니다.');
          return;
        }
        openImportMapModal(headers, dataRows, file.name);
      }catch(err){
        alert('엑셀 파일을 읽는 중 문제가 발생했습니다. 파일 형식을 확인해주세요.');
      }
    };
    reader.onerror = ()=>{ alert('파일을 읽지 못했습니다.'); };
    reader.readAsArrayBuffer(file);
  }

  function openImportMapModal(headers, dataRows, fileName){
    const backdrop = document.createElement('div');
    backdrop.className = 'sheet-backdrop';

    const mapping = {};
    IMPORT_FIELDS.forEach(f=>{ mapping[f.key] = guessColumn(headers, f.synonyms); });

    const optionsHtml = (selectedIdx)=>{
      let opts = '<option value="-1">(사용 안함)</option>';
      headers.forEach((h,i)=>{
        opts += '<option value="'+i+'"'+(i===selectedIdx?' selected':'')+'>'+esc(h || ('열 '+(i+1)))+'</option>';
      });
      return opts;
    };

    let rowsHtml = '';
    IMPORT_FIELDS.forEach(f=>{
      rowsHtml += '<div class="import-row">'
        + '<div class="import-field">'+esc(f.label)+(f.required?' <span class="import-req">*</span>':'')+'</div>'
        + '<select data-key="'+f.key+'">'+optionsHtml(mapping[f.key])+'</select>'
        + '</div>';
    });

    backdrop.innerHTML = '<div class="sheet">'
      + '<div class="handle"></div>'
      + '<h2>엑셀로 부품 일괄 등록</h2>'
      + '<div class="sub-meta">'+esc(fileName)+' · 데이터 '+dataRows.length+'행 감지됨. 각 항목이 어느 열에 해당하는지 확인해주세요.</div>'
      + '<div id="importRows">'+rowsHtml+'</div>'
      + '<label style="display:flex;align-items:flex-start;gap:8px;margin:12px 0 4px;font-size:12.5px;color:var(--muted);cursor:pointer;">'
      +   '<input type="checkbox" id="overwriteQtyChk" style="width:auto;margin:2px 0 0;">'
      +   '<span>재고 수량도 엑셀 값으로 덮어쓰기<br>(체크 안 하면 이미 등록된 부품은 현재 재고를 그대로 유지하고, 나머지 정보만 갱신합니다)</span>'
      + '</label>'
      + '<div class="import-preview">'
      +   '<div class="import-preview-head">미리보기 (상위 3행)</div>'
      +   '<div id="importPreviewBody"></div>'
      + '</div>'
      + '<div class="import-summary" id="importSummary"></div>'
      + '<div class="import-error" id="importError" style="display:none;"></div>'
      + '<button class="btn primary" id="runImportBtn" style="margin-top:14px;margin-bottom:9px;">'+ICONS.check+' 가져오기</button>'
      + '<button class="btn ghost" id="cancelImportBtn">취소</button>'
      + '</div>';
    $phone.appendChild(backdrop);
    backdrop.addEventListener('click', e=>{ if(e.target===backdrop) backdrop.remove(); });
    backdrop.querySelector('#cancelImportBtn').onclick = ()=>backdrop.remove();

    // existing parts indexed by (품명+규격) so re-imports update instead of duplicating
    const matchKey = (name, spec)=> (String(name||'').trim()+'|'+String(spec||'').trim()).toLowerCase();
    const existingByKey = new Map();
    Store.parts.forEach(p=>{ existingByKey.set(matchKey(p.name, p.spec), p); });

    function currentMapping(){
      const m = {};
      backdrop.querySelectorAll('#importRows select').forEach(sel=>{
        m[sel.getAttribute('data-key')] = parseInt(sel.value,10);
      });
      return m;
    }

    function buildRecord(row, m){
      const get = (key)=>{
        const idx = m[key];
        if(idx==null || idx<0) return null;
        return String(row[idx]==null ? '' : row[idx]).trim();
      };
      const name = get('name') || '';
      return {
        name,
        spec: get('spec') || '',
        maker: get('maker') || '',
        equipment: get('equipment') || '',
        location: get('location') || '',
        qty: Math.max(0, parseInt(get('qty'),10)||0),
        minQty: Math.max(0, parseInt(get('minQty'),10)||0),
        unit: get('unit') || '개',
        _mapped: m,
      };
    }

    function updatePreview(){
      const m = currentMapping();
      const valid = dataRows.map(r=>buildRecord(r,m)).filter(r=>r.name);
      const seen = new Set();
      let newCount = 0, updateCount = 0;
      valid.forEach(rec=>{
        const key = matchKey(rec.name, rec.spec);
        if(existingByKey.has(key) || seen.has(key)) updateCount++; else newCount++;
        seen.add(key);
      });
      const sample = valid.slice(0,3);
      let t = '<table><thead><tr><th>품명</th><th>규격</th><th>메이커</th><th>적용설비</th><th>보관위치</th><th>수량</th></tr></thead><tbody>';
      sample.forEach(r=>{
        t += '<tr><td>'+esc(r.name||'-')+'</td><td>'+esc(r.spec||'-')+'</td><td>'+esc(r.maker||'-')+'</td><td>'+esc(r.equipment||'-')+'</td><td>'+esc(r.location||'-')+'</td><td>'+esc(String(r.qty))+'</td></tr>';
      });
      t += '</tbody></table>';
      backdrop.querySelector('#importPreviewBody').innerHTML = t;
      backdrop.querySelector('#importSummary').textContent =
        '총 '+dataRows.length+'행 중 '+valid.length+'행 처리 · 신규 '+newCount+'개, 기존 갱신 '+updateCount+'개'
        + (valid.length < dataRows.length ? ' (품명이 비어있는 행은 제외됩니다).' : '.');
      const errEl = backdrop.querySelector('#importError');
      if(m.name==null || m.name<0){
        errEl.style.display = 'block';
        errEl.textContent = '품명(*) 열은 반드시 선택해야 합니다.';
        backdrop.querySelector('#runImportBtn').disabled = true;
      }else{
        errEl.style.display = 'none';
        backdrop.querySelector('#runImportBtn').disabled = false;
      }
    }

    backdrop.querySelectorAll('#importRows select').forEach(sel=>{
      sel.addEventListener('change', updatePreview);
    });
    updatePreview();

    backdrop.querySelector('#runImportBtn').onclick = async ()=>{
      const m = currentMapping();
      const overwriteQty = backdrop.querySelector('#overwriteQtyChk').checked;
      const records = dataRows.map(r=>buildRecord(r,m)).filter(r=>r.name);
      if(!records.length){ return; }
      const btn = backdrop.querySelector('#runImportBtn');
      btn.disabled = true;
      btn.textContent = '처리 중…';

      // 엑셀에는 code 열이 없으므로(품명+규격 매칭), 여기서 신규 행에 붙일 다음 코드를
      // 기존과 동일하게 순번(SP-0001, SP-0002 ...)으로 미리 계산해 둔다.
      let base = 0;
      Store.parts.forEach(p=>{
        const mtch = /^SP-(\d+)$/.exec(p.code||'');
        if(mtch) base = Math.max(base, parseInt(mtch[1],10));
      });

      const now = new Date().toISOString();
      const rowsForServer = [];
      let newCount = 0, updateCount = 0;

      records.forEach(rec=>{
        const key = matchKey(rec.name, rec.spec);
        const existing = existingByKey.get(key);
        if(existing){
          const merged = Object.assign({}, existing);
          if(m.spec>=0) merged.spec = rec.spec;
          if(m.maker>=0) merged.maker = rec.maker;
          if(m.equipment>=0) merged.equipment = rec.equipment;
          if(m.location>=0) merged.location = rec.location;
          if(m.unit>=0) merged.unit = rec.unit;
          if(m.minQty>=0) merged.minQty = rec.minQty;
          if(overwriteQty && m.qty>=0) merged.qty = rec.qty;
          merged.updatedAt = now;
          rowsForServer.push(merged);
          updateCount += 1;
        }else{
          base += 1;
          const newCode = 'SP-' + String(base).padStart(4,'0');
          const created = {
            name: rec.name, spec: rec.spec, maker: rec.maker, equipment: rec.equipment,
            location: rec.location, qty: rec.qty, minQty: rec.minQty, unit: rec.unit,
            code: newCode, updatedAt: now,
          };
          rowsForServer.push(created);
          existingByKey.set(key, created); // 같은 파일 안에서 같은 품명+규격이 또 나오면 갱신으로 처리
          newCount += 1;
        }
      });

      try{
        await Store.bulkImportParts(rowsForServer);
      }catch(err){
        btn.disabled = false;
        btn.textContent = '가져오기';
        alert(errMsg(err));
        return;
      }

      backdrop.remove();
      showToast('신규 '+newCount+'개 등록, 기존 '+updateCount+'개 갱신했습니다.');
    };
  }

      + '<div class="row-between" style="margin-bottom:6px;">'
      +   '<span style="font-size:13px;color:var(--muted);">현재 재고</span>'
      +   '<span class="pill '+(low?'warn':'ok')+'">'+(part.qty||0)+esc(part.unit||'')+' (안전재고 '+(part.minQty||0)+')</span>'
      + '</div>'
      + '<div class="row-between" style="margin-bottom:6px;">'
      +   '<span style="font-size:13px;color:var(--muted);">메이커</span>'
      +   '<span style="font-size:13px;font-weight:700;">'+esc(part.maker||'-')+'</span>'
      + '</div>'
      + '<div class="row-between" style="margin-bottom:14px;">'
      +   '<span style="font-size:13px;color:var(--muted);">보관 위치</span>'
      +   '<span style="font-size:13px;font-weight:700;">'+esc(part.location||'-')+'</span>'
      + '</div>'
      + '<div class="qr-box"><div id="qrTarget"></div></div>'
      + '<button class="btn dark" id="printLabelBtn" style="margin-bottom:14px;">'+ICONS.print+' QR 라벨 인쇄</button>'
      + '<div class="section-label" style="margin-top:4px;">최근 이력</div>'
      + (hist.length===0 ? '<div class="empty-note">이력이 없습니다.</div>' :
          '<div style="background:var(--surface2);border-radius:14px;padding:4px 12px;margin-bottom:14px;">'
          + hist.map(l=>{
              const isReversalEntry = (l.note||'').indexOf('되돌림') === 0;
              let action;
              if(l.reversed) action = '<span class="reversed-tag">취소됨</span>';
              else if(isReversalEntry) action = '';
              else action = '<button class="undo-btn" data-log="'+esc(l.id)+'">되돌리기</button>';
              return '<div class="hist-row'+(l.reversed?' is-reversed':'')+'">'
                + '<span>'+fmtTime(l.at)+'</span>'
                + '<span style="display:flex;align-items:center;">'
                +   '<span class="d '+l.type+'">'+(l.type==='in'?'입고 +':'출고 -')+l.qty+'</span>'
                +   action
                + '</span>'
                + '</div>';
            }).join('')
          + '</div>')
      + '<button class="btn ghost" id="closeDetailBtn">닫기</button>'
      + '<div class="delete-part-row"><button id="deletePartBtn">'+ICONS.trash+' 부품 삭제</button></div>'
      + '</div>';
    $phone.appendChild(backdrop);
    backdrop.addEventListener('click', e=>{ if(e.target===backdrop) backdrop.remove(); });
    backdrop.querySelector('#closeDetailBtn').onclick = ()=>backdrop.remove();
    backdrop.querySelector('#editPartBtn').onclick = ()=>{ backdrop.remove(); openEditForm(part); };

    backdrop.querySelector('#deletePartBtn').onclick = async ()=>{
      const ok = window.confirm(part.name+' 부품을 삭제할까요?\n입출고 이력은 남지만, 이 부품과 QR코드는 더 이상 사용할 수 없습니다.');
      if(!ok) return;
      try{
        await Store.deletePart(part.code);
      }catch(err){ alert(errMsg(err)); return; }
      backdrop.remove();
      setTab('parts');
      showToast('삭제되었습니다: '+part.name, ICONS.trash);
    };

    backdrop.querySelectorAll('.undo-btn').forEach(btn=>{
      btn.onclick = async ()=>{
        const log = hist.find(x=>x.id===btn.dataset.log);
        if(!log) return;
        const ok = window.confirm((log.type==='in'?'입고':'출고')+' '+log.qty+(part.unit||'')+' 기록을 되돌릴까요? 재고가 원래대로 조정됩니다.');
        if(!ok) return;
        try{
          await Store.reverseLog(log.id);
        }catch(err){ alert(errMsg(err)); return; }
        backdrop.remove();
        openDetail(code);
        showToast('되돌렸습니다: '+part.name);
      };
    });

    const qrTarget = backdrop.querySelector('#qrTarget');
    if(window.QRCode){
      new QRCode(qrTarget, { text: part.code, width:160, height:160, colorDark:'#0B2C4D', colorLight:'#ffffff', correctLevel: QRCode.CorrectLevel.M });
    }else{
      qrTarget.textContent = part.code;
    }

    backdrop.querySelector('#printLabelBtn').onclick = ()=>printPartLabel(part);
  }

  // ---------- label images & printing ----------
  // 아티팩트 샌드박스에서는 window.print() 인쇄 대화상자가 막혀 있어 부득이 이미지로
  // 우회했었지만, 앱스 스크립트 웹앱은 실제 최상위 페이지라 브라우저 인쇄가 정상 동작한다.
  // 그래서 "다운로드"(파일로 저장) + "인쇄"(브라우저 인쇄 대화상자) 두 가지를 모두 제공한다.
  function qrDataUrl(text, size){
    const holder = document.createElement('div');
    holder.style.position = 'fixed'; holder.style.left = '-9999px'; holder.style.top = '-9999px';
    document.body.appendChild(holder);
    let url = null;
    if(window.QRCode){
      new QRCode(holder, { text, width:size, height:size, colorDark:'#000000', colorLight:'#ffffff', correctLevel: QRCode.CorrectLevel.M });
      const qrEl = holder.querySelector('canvas') || holder.querySelector('img');
      if(qrEl) url = qrEl.tagName === 'CANVAS' ? qrEl.toDataURL('image/png') : qrEl.src;
    }
    holder.remove();
    return url;
  }

  function loadImage(src){
    return new Promise(resolve=>{
      if(!src){ resolve(null); return; }
      const img = new Image();
      img.onload = ()=>resolve(img);
      img.onerror = ()=>resolve(null);
      img.src = src;
    });
  }

  async function composeLabelCanvas(part, size){
    size = size || 240;
    const W = size + 40, H = size + 120;
    const canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,W,H);
    const qrImg = await loadImage(qrDataUrl(part.code, size));
    if(qrImg) ctx.drawImage(qrImg, 20, 14, size, size);
    ctx.fillStyle = '#000000';
    ctx.textAlign = 'center';
    ctx.font = 'bold 19px sans-serif';
    ctx.fillText(part.name, W/2, size+42, W-16);
    ctx.font = '13.5px sans-serif';
    ctx.fillText(part.code, W/2, size+64);
    const metaLine = [part.spec, part.maker, part.location].filter(Boolean).join(' · ');
    if(metaLine){
      ctx.font = '11px sans-serif';
      ctx.fillText(metaLine, W/2, size+85, W-16);
    }
    return canvas;
  }

  async function composeLabelsCanvas(parts){
    const size = 220, gap = 16;
    const canvases = [];
    for(const p of parts){ canvases.push(await composeLabelCanvas(p, size)); }
    const W = size + 40;
    const H = canvases.reduce((sum,c)=>sum+c.height, 0) + gap*Math.max(0, canvases.length-1) + 20;
    const combined = document.createElement('canvas');
    combined.width = W; combined.height = H;
    const ctx = combined.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,W,H);
    let y = 10;
    canvases.forEach((c,i)=>{
      ctx.drawImage(c, 0, y);
      y += c.height;
      if(i < canvases.length-1){
        ctx.strokeStyle = '#dddddd';
        ctx.beginPath(); ctx.moveTo(10, y+gap/2); ctx.lineTo(W-10, y+gap/2); ctx.stroke();
        y += gap;
      }
    });
    return combined;
  }

  function printLabelsNative(parts){
    const holder = document.getElementById('printLabel');
    if(!holder) return;
    let html = '';
    parts.forEach(p=>{
      const url = qrDataUrl(p.code, 220);
      const metaLine = [p.spec, p.maker, p.location].filter(Boolean).join(' · ');
      html += '<div class="print-label-block">'
        + '<div class="print-qr-box">'+(url ? '<img src="'+url+'" width="220" height="220">' : '')+'</div>'
        + '<div class="print-name">'+esc(p.name)+'</div>'
        + '<div class="print-code">'+esc(p.code)+'</div>'
        + (metaLine ? '<div class="print-meta">'+esc(metaLine)+'</div>' : '')
        + '</div>';
    });
    holder.innerHTML = html;
    setTimeout(()=>{ window.print(); }, 60);
  }

  function showLabelImageSheet(canvas, count, parts){
    const dataUrl = canvas.toDataURL('image/png');
    const canCopy = !!(navigator.clipboard && window.ClipboardItem);
    const backdrop = document.createElement('div');
    backdrop.className = 'sheet-backdrop';
    backdrop.innerHTML = '<div class="sheet">'
      + '<div class="handle"></div>'
      + '<h2>QR 라벨'+(count>1 ? ' ('+count+'개)' : '')+'</h2>'
      + '<div class="sub-meta">라벨 프린터 전용 프로그램이면 <b>이미지 다운로드</b>로 파일을 받아 불러오세요. 바로 인쇄하려면 <b>인쇄</b>를 눌러 브라우저 인쇄 대화상자를 사용하세요.</div>'
      + '<div style="background:#fff;border-radius:14px;padding:10px;margin-bottom:14px;text-align:center;border:1px solid var(--line);">'
      +   '<img id="labelImgTag" src="'+dataUrl+'" style="max-width:100%;border-radius:6px;">'
      + '</div>'
      + '<button class="btn primary" id="printLabelsBtn" style="margin-bottom:9px;">'+ICONS.print+' 인쇄</button>'
      + '<a class="btn dark" id="downloadLabelImgBtn" download="qr-label.png" href="'+dataUrl+'" style="display:block;text-align:center;text-decoration:none;box-sizing:border-box;margin-bottom:9px;">'+ICONS.download+' 이미지 다운로드</a>'
      + (canCopy ? '<button class="btn ghost" id="copyLabelImgBtn" style="margin-bottom:9px;">'+ICONS.check+' 이미지 복사</button>' : '')
      + '<button class="btn ghost" id="closeLabelImgBtn">닫기</button>'
      + '</div>';
    $phone.appendChild(backdrop);
    backdrop.addEventListener('click', e=>{ if(e.target===backdrop) backdrop.remove(); });
    backdrop.querySelector('#closeLabelImgBtn').onclick = ()=>backdrop.remove();

    backdrop.querySelector('#printLabelsBtn').onclick = ()=>{ printLabelsNative(parts||[]); };

    const copyBtn = backdrop.querySelector('#copyLabelImgBtn');
    if(copyBtn) copyBtn.onclick = ()=>{
      canvas.toBlob(async (blob)=>{
        if(!blob){ showToast('복사에 실패했어요. 이미지를 우클릭해서 복사해주세요.'); return; }
        try{
          await navigator.clipboard.write([ new ClipboardItem({ [blob.type]: blob }) ]);
          showToast('이미지가 복사되었어요. 다른 앱에 붙여넣기(Ctrl+V) 하세요.', ICONS.check);
        }catch(e){
          showToast('복사에 실패했어요. 이미지를 길게 누르거나 우클릭해서 복사해주세요.');
        }
      }, 'image/png');
    };
  }

  async function printPartLabels(parts){
    if(!parts.length) return;
    showToast('라벨 이미지를 만드는 중…');
    const canvas = await composeLabelsCanvas(parts);
    showLabelImageSheet(canvas, parts.length, parts);
  }

  function printPartLabel(part){ printPartLabels([part]); }

  // ---------- boot ----------
  // "?code=SP-0031" 딥링크는 서버(doGet)가 e.parameter.code로 직접 읽어 템플릿에
  // 독립 호스팅에서 서비스되는 완전한 정적 페이지라서(아티팩트/앱스 스크립트 iframe
  // 샌드박스와 달리 실제 최상위 문서), location.search가 항상 그대로 유효하다. 다만
  // Store 데이터는 이제 서버 템플릿이 아니라 fetch()로 비동기로 받아오므로, 부품 조회가
  // 가능해지는 첫 refresh() 완료 시점까지 기다렸다가 처리한다.
  function getDeepLinkCode(){
    try{
      return new URLSearchParams(location.search).get('code') || null;
    }catch(e){ return null; }
  }

  function boot(){
    render();
    const code = getDeepLinkCode();
    const ready = Store.init();
    if(code && ready && ready.then){
      ready.then(()=>{
        setTab('scan');
        stopScanner();
        onScanResult(code);
      });
    }
  }

  if(document.readyState === 'loading'){
    window.addEventListener('DOMContentLoaded', boot);
  }else{
    boot();
  }

})();
</script>
</body>
</html>
